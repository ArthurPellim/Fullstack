<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Adivinhação</title>
  <link rel="stylesheet" href="guessing.css">
</head>

<body>

  <div class="container">
    <h1>Adivinhe o Número</h1>

    <p>Digite um número de 1 a 100</p>

    <input type="number" id="numeroUsuario" min="1" max="100">

    <button onclick="verificarNumero()">
      Verificar
    </button>

    <div id="resultado">
      Resultado aparecerá aqui
    </div>
  </div>


  <script src="guessing.js"></script>

</body>
</html>
